<!doctype html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ciberseguridad" />
    <meta name="keywords" content="cybersecurity" />
    <link rel="icon" href="images/icons/9.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/index.css" />
    <script
      src="https://kit.fontawesome.com/bcc6ce623e.js"
      crossorigin="anonymous"
    ></script>
    <title>Atalanta</title>
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <!---Logo Atalanta-->
        <img src="images/Atalanta/ATALANTA_logo.png" alt="Atalanta's logo">
        <div class="navbar__div">    
            <a href="register.html" class="btn__link">Registro</a>
        </div>
        </nav>
    </header>
    <main class="login">
      <section class="login__section">
        <div class="login__container">
          <header class="login__header">
            <h1 class="login__title">Inicia sesión</h1>
            <p class="login__subtitle">
              Introduce tus credenciales para acceder a tu cuenta
            </p>
          </header>
          <form class="login__form">
            <!-- Email -->
            <div class="login__field">
              <label class="login__label" for="email">Email</label>
              <div class="login__input-wrapper">
                <i class="fa-solid fa-envelope login__icon"></i>
                <input
                  class="login__input"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Email"
                  required
                />
              </div>
            </div>

            <!-- Password -->
            <div class="login__field">
              <label class="login__label" for="password">Contraseña</label>

              <div class="login__input-wrapper">
                <i class="fa-solid fa-lock login__icon"></i>
                <input
                  class="login__input"
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Contraseña"
                  required
                />
              </div>
            </div>
            <!-- Remember -->
            <div class="login__remember">
              <input
                class="login__checkbox"
                type="checkbox"
                id="remember"
                name="remember"
              />
              <label class="login__remember-label" for="remember">
                Recuérdame
              </label>
            </div>
            <!-- Button -->
            <button class="login__button" type="submit">Iniciar sesión</button>
            <!-- Register -->
            <p class="login__register">
              ¿No tienes cuenta?
              <a class="login__register-link" href="register.html">
                Crea una aquí
              </a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="./scripts/script.js"></script>
    <script type="module" src="./scripts/header.js"></script>
  </body>
</html>
