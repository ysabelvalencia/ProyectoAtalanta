<div class="ticket-detail">

  <h2 id="ticketTitle"></h2>
  <p id="ticketDescription"></p>

  <div>
    <label>Estado:</label>
    <select id="statusSelect"></select>
    <button id="saveStatusBtn">Guardar</button>
  </div>

  <hr>

  <h3>Comentarios</h3>

  <div id="commentsContainer"></div>

  <div id="commentForm">
    <textarea id="commentInput" placeholder="Escribe un comentario"></textarea>
    <button id="sendCommentBtn">Enviar</button>
  </div>

</div>
