<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ciberseguridad" />
    <meta name="keywords" content="cybersecurity" />

    <title>Atalanta - Registro</title>

    <link rel="icon" href="../assets/images/ui/9.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/index.css" />

    <script
      src="https://kit.fontawesome.com/bcc6ce623e.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="header">
      <nav class="navbar">
        <a href="../index.html" class="btn__link"><img src="../assets/images/logos/ATALANTA_logo.png" alt="Atalanta's logo"></a>
        <a href="./login.html" class="nav__btn__lr">Login</a>
      </nav>
    </header>

    <main class="register">
      <section class="register__section">
        <div class="register__container">
          <header class="register__header">
            <h1 class="register__title">Regístrate</h1>

            <p class="register__subtitle">
              Crea una nueva cuenta en el sistema
            </p>
          </header>

          <form class="register__form" id="registerForm">
            <!-- Nombre -->

            <div class="register__input-wrapper">
              <i class="fa-solid fa-user"></i>

              <input
                class="register__input"
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Introduce tu nombre"
                required
              />
            </div>

            <!-- Email -->

            <div class="register__input-wrapper">
              <i class="fa-solid fa-envelope"></i>

              <input
                class="register__input"
                type="email"
                id="email"
                name="email"
                placeholder="Introduce tu email"
                required
              />
            </div>

            <!-- Password -->

            <div class="register__input-wrapper">
              <i class="fa-solid fa-lock"></i>

              <input
                class="register__input"
                type="password"
                id="password"
                name="password"
                placeholder="Introduce tu contraseña"
                required
              />
            </div>

            <button class="register__button" type="submit">Crear cuenta</button>

            <p class="login__register">
              ¿Ya tienes cuenta?

              <a class="register__login-link" href="login.html">
                Inicia sesión aquí
              </a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
